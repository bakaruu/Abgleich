# Local development environment.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the database data)
name: abgleich

services:
  postgres:
    image: postgres:17-alpine
    container_name: abgleich-postgres-local-database
    environment:
      POSTGRES_DB: abgleich
      POSTGRES_USER: abgleich
      POSTGRES_PASSWORD: ${ABGLEICH_DB_PASSWORD:-abgleich-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - local-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abgleich -d abgleich"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode: invoice events out (outbox relay), InvoiceCreated events in.
  # No volume: pending events live in the PostgreSQL outbox, not in the broker.
  kafka:
    image: apache/kafka:4.2.1
    container_name: abgleich-kafka-local-broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    networks:
      - local-network

  # The bank's SFTP drop: user "bank" with the folders inbox, processed and error.
  # Its host key changes when the container is recreated, so the application accepts unknown keys
  # only when ABGLEICH_SFTP_ALLOW_UNKNOWN_KEYS=true is set for local runs.
  sftp:
    image: atmoz/sftp:alpine
    container_name: abgleich-sftp-local-bank-drop
    command: bank:${ABGLEICH_SFTP_PASSWORD:-sftp-local-only}:1001::inbox,processed,error
    ports:
      - "2222:22"
    volumes:
      - sftp-data:/home/bank
    networks:
      - local-network

volumes:
  postgres-data:
    name: abgleich-postgres-local-data
  sftp-data:
    name: abgleich-sftp-local-bank-drop-data

networks:
  local-network:
    name: abgleich-local-network
