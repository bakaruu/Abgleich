name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, architecture rules and bug catalogue tests
        run: ./gradlew build --console=plain
      - name: Mutation testing of the rules and the use cases
        run: ./gradlew :domain:pitest :application:pitest --console=plain
      - name: Matching precision over the labelled dataset
        run: ./gradlew evaluateMatching --console=plain

  secrets:
    name: Secret scan (B45)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
