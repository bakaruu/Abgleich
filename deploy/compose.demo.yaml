# The public demo on one small VPS: Caddy in front, the application, PostgreSQL, Kafka, Prometheus and Grafana.
#
#   cp .env.example .env    # then fill in the values; .env is never committed (B45)
#   docker compose -f compose.demo.yaml up -d --wait
#
# Only Caddy publishes ports. PostgreSQL, Kafka, metrics and the SFTP-free application stay inside the network (B44).
name: abgleich-demo

services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: abgleich-demo-caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ABGLEICH_DOMAIN: ${ABGLEICH_DOMAIN:?Set ABGLEICH_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      grafana:
        condition: service_started

  app:
    image: ${ABGLEICH_IMAGE:-ghcr.io/bakaruu/abgleich}:${ABGLEICH_IMAGE_TAG:-latest}
    container_name: abgleich-demo-application
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: demo
      ABGLEICH_DB_URL: jdbc:postgresql://postgres:5432/abgleich
      ABGLEICH_DB_USER: abgleich
      ABGLEICH_DB_PASSWORD: ${ABGLEICH_DB_PASSWORD:?Set ABGLEICH_DB_PASSWORD in .env}
      ABGLEICH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 10
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: abgleich-demo-postgres-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: abgleich
      POSTGRES_USER: abgleich
      POSTGRES_PASSWORD: ${ABGLEICH_DB_PASSWORD:?Set ABGLEICH_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abgleich -d abgleich"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  # The native Kafka image starts in a second and needs little memory. Events of the demo are not kept across
  # restarts of the broker: the outbox in PostgreSQL is the durable record (B23).
  kafka:
    image: apache/kafka-native:4.2.1
    container_name: abgleich-demo-kafka-broker
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    mem_limit: 384m

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: abgleich-demo-prometheus-metrics
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m

  # Read-only for visitors: anonymous viewers, no sign-up. The admin password is only for maintenance.
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: abgleich-demo-grafana-dashboards
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${ABGLEICH_PUBLIC_URL:?Set ABGLEICH_PUBLIC_URL in .env}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/abgleich.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  caddy-data:
    name: abgleich-demo-caddy-data
  caddy-config:
    name: abgleich-demo-caddy-config
  postgres-data:
    name: abgleich-demo-postgres-data
  prometheus-data:
    name: abgleich-demo-prometheus-data
  grafana-data:
    name: abgleich-demo-grafana-data

networks:
  default:
    name: abgleich-demo-network
