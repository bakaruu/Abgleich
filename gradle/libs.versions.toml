[versions]
spring-boot = "4.1.1"
archunit = "1.5.0"
jqwik = "1.10.1"
htmx = "2.0.4"
commons-csv = "1.14.0"
shedlock = "7.10.1"
# Same version spring-integration-sftp uses; tests start an embedded SFTP server with it.
sshd = "2.18.0"
playwright = "1.63.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }
htmx = { module = "org.webjars.npm:htmx.org", version.ref = "htmx" }

shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-provider-jdbc = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }
sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }

testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
